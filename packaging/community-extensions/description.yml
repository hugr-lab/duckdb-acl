# What we submit to duckdb/community-extensions (specs/045). Kept here so the thing we ask them to
# build is reviewable in this repository rather than only in a pull request against theirs.
#
# What is excluded, and why (owner's decision 2026-09-14; specs/045 argued the other way and its
# addendum says so). WASM: the extension builds there, but a browser tab has no boundary the query's
# author cannot cross - the page composes the prefix itself and can as easily not load acl at all - so
# the artifact would be a rewriter with nothing behind it, and publishing it invites a use that cannot
# be secure. Both doors are absent there anyway. osx_amd64: nobody runs a server on an Intel Mac, and
# this extension exists to be served from; an Intel-Mac user builds from source instead. What is left
# is what the extension is for: linux amd64/arm64, osx arm64, and Windows under MSVC and MinGW.
extension:
  name: acl
  description: Role and token scoped access control for DuckDB, enforced by rewriting the statement before bind
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  # macOS still ships bison 2.3, and thrift - which arrow pulls in - has a grammar it cannot parse.
  # This is the documented way to ask for a modern one (brew install bison flex; winflexbison3 on
  # Windows). `airport` carries the same line for the same reason.
  requires_toolchains: parser_tools
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;osx_amd64"
  maintainers:
    - vgsml

repo:
  github: hugr-lab/duckdb-acl
  ref: TBD

docs:
  hello_world: |
    -- A gateway prefixes each statement with the principal; the extension resolves the virtual
    -- catalog, applies row filters and column masks, and hands ordinary SQL to the binder.
    ACL ROLE 'analyst' SELECT id, amount FROM orders;
  extended_description: |
    The extension enforces access control in a `parser_override`: it rewrites the statement before
    bind, so a principal only ever sees the objects, rows and columns its grants allow. Clients that
    connect for themselves are served through a door - quack, or the built-in Arrow Flight SQL server
    reachable by any ADBC or JDBC driver - which turns a JWT into a session and prefixes every
    statement after that.
