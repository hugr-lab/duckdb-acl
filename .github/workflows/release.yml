# Release builds (specs/005), platform set after hugr-lab/mssql-extension plus wasm:
# linux_amd64, linux_arm64, osx_arm64, windows_amd64 (MSVC), wasm_mvp/wasm_eh/wasm_threads.
# Runs on version tags and manually; on a tag the artifacts are attached to the GitHub release.
# Everything builds the pinned duckdb submodule - no floating upstream.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-unix:
    name: Build (${{ matrix.platform.id }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux_amd64
            runner: ubuntu-24.04
          - id: linux_arm64
            runner: ubuntu-24.04-arm
          - id: osx_arm64
            runner: macos-14
    env:
      # Not for WASM: extension-ci-tools configures those targets with $(GENERATOR) and then runs
      # `emmake make`, so Ninja leaves it hunting for a Makefile nobody wrote. This is why the wasm
      # jobs had never produced an artifact.
      GEN: ${{ startsWith(matrix.platform.id, 'wasm') && '' || 'ninja' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history + tags, so `git describe` stamps the extension version

      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja ccache
          else
            sudo apt-get update && sudo apt-get install -y ninja-build ccache
          fi

      # The Flight SQL door is part of a released artifact, so these builds need Arrow from vcpkg -
      # every platform except WASM, where the manifest's `!wasm32` leaves it out and CMakeLists leaves
      # the door out with it.
      - name: Setup vcpkg
        if: ${{ !startsWith(matrix.platform.id, 'wasm') }}
        run: make vcpkg-setup

      - name: Cache vcpkg binary packages
        if: ${{ !startsWith(matrix.platform.id, 'wasm') }}
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-rel-${{ matrix.platform.id }}-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-rel-${{ matrix.platform.id }}-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-
            vcpkg-bincache-rel-${{ matrix.platform.id }}-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-rel-${{ matrix.platform.id }}-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-rel-${{ matrix.platform.id }}-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-
            ccache-rel-${{ matrix.platform.id }}-

      - name: Build
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      - name: Test
        run: |
          build/release/test/unittest test/sql/acl.test
          make test-cpp

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/release/extension/acl/acl.duckdb_extension dist/acl-${{ matrix.platform.id }}.duckdb_extension

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: acl-${{ matrix.platform.id }}
          path: dist/acl-${{ matrix.platform.id }}.duckdb_extension

  build-windows:
    name: Build (windows_amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-rel-windows-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-rel-windows-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-
            vcpkg-bincache-rel-windows-

      - name: Build (MSVC, mirrors the ci-tools cmake invocation)
        shell: bash
        run: |
          choco install ninja -y
          # `x64-windows-static`, not `-static-md`: duckdb builds extension objects against the static
          # CRT, and the dynamic-CRT triplet ends the build at LNK2038 after three hours of vcpkg.
          cmake -G Ninja -S duckdb -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXTENSION_STATIC_BUILD=1 \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/extension_config.cmake" \
            -DDUCKDB_EXPLICIT_PLATFORM=windows_amd64 \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE"
          cmake --build build/release --target acl_loadable_extension

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/release/extension/acl/acl.duckdb_extension dist/acl-windows_amd64.duckdb_extension

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: acl-windows_amd64
          path: dist/acl-windows_amd64.duckdb_extension

  build-wasm:
    name: Build (${{ matrix.duckdb_arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        duckdb_arch: [wasm_mvp, wasm_eh, wasm_threads]
    env:
      GEN: ninja
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Build
        run: make ${{ matrix.duckdb_arch }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/${{ matrix.duckdb_arch }}/extension/acl/acl.duckdb_extension.wasm \
             dist/acl-${{ matrix.duckdb_arch }}.duckdb_extension.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: acl-${{ matrix.duckdb_arch }}
          path: dist/acl-${{ matrix.duckdb_arch }}.duckdb_extension.wasm

  publish:
    name: Attach artifacts to the release
    runs-on: ubuntu-24.04
    needs: [build-unix, build-windows, build-wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
