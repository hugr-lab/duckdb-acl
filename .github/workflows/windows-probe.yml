# Windows probes, run by hand (specs/045).
#
# Two questions nobody has answered yet, and they are different questions:
#
#   msvc-flight   - does the Arrow Flight SQL door build and link on Windows/MSVC? Arrow, gRPC and
#                   their dependencies come from vcpkg's static triplet. If this works, the door can
#                   be considered for the release matrix; if it does not, we learn why here rather
#                   than during a release.
#
#                   First answer: everything *builds* - abseil, gRPC, Arrow, Flight and Flight SQL all
#                   compiled under MSVC, and so did duckdb. The link then failed on LNK2038, a runtime
#                   library mismatch: `x64-windows-static-md` builds its libraries against the dynamic
#                   CRT (/MD) while duckdb's extension objects use the static one (/MT). Hence the
#                   triplet below is `x64-windows-static`. Worth keeping in the comment: the failure
#                   looked like "Arrow does not work on Windows" and was nothing of the kind.
#   mingw-plain   - does the extension build under MinGW *at all*? The release matrix has no MinGW,
#                   so this is unmeasured ground. The door is excluded there by CMakeLists (Arrow and
#                   gRPC through vcpkg are an MSVC story), so this deliberately builds without it:
#                   the point is the baseline, not the door.
#
# Dispatch only. Each of these is expensive and neither belongs on a pull request.
name: Windows probe

on:
  workflow_dispatch:

jobs:
  msvc-flight:
    name: Probe (windows_amd64, MSVC, flight door)
    runs-on: windows-latest
    env:
      ACL_FLIGHT: 1
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-msvc-flight-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-msvc-flight-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-
            vcpkg-bincache-msvc-flight-

      - name: Setup vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      # The cmake invocation is spelled out rather than going through the Makefile, the way release.yml
      # does for Windows - so the manifest feature that carries Arrow has to be named here too.
      - name: Build (MSVC, with the door)
        shell: bash
        run: |
          choco install ninja -y
          cmake -G Ninja -S duckdb -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXTENSION_STATIC_BUILD=1 \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/extension_config.cmake" \
            -DDUCKDB_EXPLICIT_PLATFORM=windows_amd64 \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE" \
            -DVCPKG_MANIFEST_FEATURES=flight
          cmake --build build/release --target acl_loadable_extension

      - name: What the artifact carries
        shell: bash
        run: |
          ls -la build/release/extension/acl/acl.duckdb_extension
          # dumpbin is the Windows counterpart of otool/objdump; the check script knows neither, so the
          # list is printed for a human rather than asserted. Making it an assertion is worth doing once
          # this probe says the build is possible at all.
          dumpbin //dependents build/release/extension/acl/acl.duckdb_extension || true

  mingw-plain:
    name: Probe (windows_amd64, MinGW, no door)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git

      - name: Build (MinGW, no door)
        shell: msys2 {0}
        run: |
          cmake -G Ninja -S duckdb -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXTENSION_STATIC_BUILD=1 \
            -DDUCKDB_EXTENSION_CONFIGS="$(pwd)/extension_config.cmake" \
            -DDUCKDB_EXPLICIT_PLATFORM=windows_amd64_mingw
          cmake --build build/release --target acl_loadable_extension
          ls -la build/release/extension/acl/acl.duckdb_extension
