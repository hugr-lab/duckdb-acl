# The build community-extensions will run, run here first (specs/045).
#
# We are not submitting yet - that happens alongside duckdb 2.0 - but the point of preparing is to find
# out on our own repository what would otherwise be found in someone else's pipeline. So this calls the
# very workflow they call, with the same inputs, rather than a matrix of our own that resembles it.
#
# Two things it teaches that our hand-rolled release.yml could not:
#
#   - it builds against `duckdb_version`, checking the submodule out to that version rather than to our
#     pin. That is what community-extensions does, and it is why our code has to compile against a
#     duckdb we do not choose. Tracking `main` here is the early warning for that.
#   - it covers the platforms they cover, with their triplets - including MinGW and musl, which our own
#     matrix never had.
#
# The Flight SQL door needs Arrow, so the vcpkg binary cache is what keeps this in minutes rather than
# hours: see docs/vcpkg-cache-r2.md. Without the secrets (a fork, for instance) it falls back to
# duckdb's public read-only cache and is merely slow.
name: Distribution build

# Run it on every merge to main, on a release tag, and when we ask. Not on a schedule: this matrix
# builds Arrow and gRPC on nine platforms, and a nightly one would spend that on days when nothing
# changed - a merge is exactly the day something did. Merge-time runs are what give Windows (MSVC and
# MinGW), musl and wasm their coverage at all: the PR jobs stay on Linux and macOS to keep PRs fast,
# and the early warning about duckdb `main` drift arrives with the change that has to live with it.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: distribution-${{ github.ref }}
  # Deliberately not cancelling: these runs fill the vcpkg cache, and a cancelled one leaves nothing
  # behind for the next. `airport` sets the same.
  cancel-in-progress: false

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: acl
      duckdb_version: main
      ci_tools_version: main
      # No exclusions: WASM gets the extension without the door, because the Arrow dependency carries
      # `"platform": "!wasm32"` and CMakeLists guards on WASM_ENABLED (specs/045).
      #
      # macOS ships bison 2.3, which cannot parse thrift's grammar - and thrift comes with Arrow.
      # This asks for a modern bison and flex; the same string goes into description.yml as
      # `requires_toolchains`, which is where `airport` carries it too.
      extra_toolchains: parser_tools
      vcpkg_binary_sources: ${{ vars.VCPKG_BINARY_SOURCES }}
    secrets:
      VCPKG_CACHING_AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      VCPKG_CACHING_AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      VCPKG_CACHING_AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      VCPKG_CACHING_AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}

  # Release mechanics (release plan 5.3): on a v* tag, the nine artifacts the distribution built become
  # a GitHub release - one file per platform, a SHA256SUMS.txt beside them, and a build-provenance
  # attestation for each, so a downloaded .duckdb_extension can be traced to the workflow run that
  # produced it. An extension that IS the authorization boundary is the one artifact a tampered copy
  # of would matter most; the attestation costs nothing and is verified with `gh attestation verify`.
  # The first release follows duckdb 2.0 (community-extensions alongside); until then a tag publishes
  # a pre-release for our own use - `prerelease` is automatic on a `-` in the tag (v0.1.0-rc1).
  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download every platform's artifact
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # the reusable workflow names an artifact acl-<duckdb_version>-extension-<platform> and puts the
      # extension file somewhere inside it; the release wants one flat file per platform, named by
      # the tag's version so two releases never collide in a download directory
      - name: Collect the extensions
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          found=0
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            platform="${name##*-extension-}"
            file="$(find "$dir" -name 'acl.duckdb_extension*' -type f | head -1)"
            if [ -z "$file" ]; then
              echo "::error::no extension file in artifact $name"
              exit 1
            fi
            ext="${file##*/acl.duckdb_extension}"
            cp "$file" "release/acl-${version}-${platform}.duckdb_extension${ext}"
            found=$((found + 1))
          done
          [ "$found" -ge 9 ] || { echo "::error::expected nine platforms, found $found"; exit 1; }
          (cd release && sha256sum *.duckdb_extension* > SHA256SUMS.txt)
          ls -la release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.duckdb_extension*

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.duckdb_extension*
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            duckdb-acl ${{ github.ref_name }} — one `.duckdb_extension` per platform, built by the
            distribution workflow against the duckdb version it names. Verify a download with
            `sha256sum -c SHA256SUMS.txt` and its provenance with
            `gh attestation verify <file> --repo hugr-lab/duckdb-acl`.

            Load it with `LOAD '<path>/acl-…-<platform>.duckdb_extension';` on a duckdb of the same
            version (`-unsigned` until the extension is signed by community-extensions).
