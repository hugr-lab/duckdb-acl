# CI (specs/005), layout after hugr-lab/mssql-extension: lint + a Linux build that runs the unit
# suites AND the integration scenarios against live databases (GitHub service containers share the
# schemas with docker/docker-compose.yml via docker/init/*.sql), plus a representative macOS build
# on merges to main and manual runs. Full platform coverage lives in release.yml.
#
# NOTE: the extension tracks duckdb `main` (submodule pin); everything here builds the pinned
# submodule, so a red build means our code or the pin - never a floating upstream.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the project standard is duckdb's pinned formatter (scripts/format.py: clang_format==11.0.1);
      # the runner's default clang-format is newer and reflows the code differently
      - name: Install duckdb's pinned clang-format
        run: pip install clang_format==11.0.1
      - name: clang-format check
        run: |
          find src test/cpp \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build-test-linux:
    name: Build + test (linux_amd64)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: acl
          POSTGRES_PASSWORD: aclpass
          POSTGRES_DB: acltest
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -U acl -d acltest"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: aclpass
          MYSQL_DATABASE: acltest
          MYSQL_USER: acl
          MYSQL_PASSWORD: aclpass
        ports:
          - 6433:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -paclpass"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GEN: ninja
      ACL_INTEGRATION: 1
      # the quack door is built here too (spec 041), so the live round trip runs on every PR rather
      # than only where someone built it by hand. quack is pre-release and the callback contract is
      # what we stand on: a change to it should arrive as a red build, not as a surprise later.
      ACL_QUACK: 1
      # Opting out of the Flight door keeps this job about the scanners and the quack door, which is
      # what it is for. The flight job below builds the default configuration - the one that ships.
      ACL_NO_FLIGHT: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache postgresql-client mysql-client

      # scanner dependencies (libpq/openssl/roaring/...) come from vcpkg via the merged manifests
      # of the loaded extensions - the standard duckdb-extension dependency flow
      - name: Setup vcpkg
        run: make vcpkg-setup

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-linux_amd64-${{ hashFiles('.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-linux_amd64-${{ hashFiles('.gitmodules') }}-
            vcpkg-bincache-linux_amd64-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux_amd64-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux_amd64-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-
            ccache-linux_amd64-

      - name: Build (with scanners)
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      - name: Unit suites
        run: |
          build/release/test/unittest test/sql/acl.test
          make test-cpp

      - name: Initialize integration schemas
        run: |
          PGPASSWORD=aclpass psql -h localhost -p 6432 -U acl -d acltest -f docker/init/postgres.sql
          mysql -h 127.0.0.1 -P 6433 -u acl -paclpass acltest < docker/init/mysql.sql

      - name: Integration tests
        run: make test-integration

      - name: Upload extension artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: acl-linux_amd64
          path: build/release/extension/acl/acl.duckdb_extension

  # The Arrow Flight SQL door (specs/045). Its own job rather than a step in the Linux one - it pulls
  # Arrow with Flight SQL, 89 vcpkg ports that have nothing to do with the scanners - and, like the
  # macOS job, off pull requests: a cold build of it takes an hour and a half.
  #
  # That it does not run on PRs is what keeps the plain Actions cache sufficient. The repository's cache
  # budget is 10 GB with eviction by age, and this build's share of it is well over a gigabyte competing
  # with the integration cache and seven release ccaches; a job that runs on merges and on request fills
  # it rarely enough not to fight for room. A pull request that needs the door checked can dispatch this
  # workflow by hand.
  build-test-flight:
    name: Build + test (flight door)
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
      # No ACL_NO_FLIGHT: the door is what a default build produces, so this job builds the
      # full-functionality configuration community-extensions ships - flight AND the embedded quack
      # server (spec 063). It runs on PRs too, not only on push: 063's whole surface (the door's TLS
      # and its OpenSSL RNG) lives on this path, so it must be a red build on a PR, not a surprise at
      # distribution time.
      # ACL_QUACK adds the quack *client* loadable so the embedded-door cpp test can ATTACH to itself.
      ACL_QUACK: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          # the e2e client is third-party on purpose: a door is only proven by something that is not us
          pip install pyarrow adbc_driver_flightsql adbc_driver_manager

      - name: Setup vcpkg
        run: make vcpkg-setup

      # Keyed on vcpkg.json too: Arrow arrives through the `flight` manifest feature, so a change there
      # is a change of dependencies and the old cache no longer describes this build.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-flight-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-flight-${{ hashFiles('.gitmodules', 'vcpkg.json') }}-
            vcpkg-bincache-flight-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-flight-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-flight-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-
            ccache-flight-

      - name: Build (with the Flight door)
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      # Before anything is run: an artifact that borrowed a library from the runner would work here and
      # nowhere else, and neither of the two times that happened showed up in a build log.
      - name: Check the artifact carries its dependencies
        run: make check-flight-deps

      - name: Unit suites
        run: |
          build/release/test/unittest test/sql/acl.test
          # the embedded quack door's cpp test runs HERE, on the flight build, so its TLS + OpenSSL
          # RNG path is exercised (the no-flight linux job above builds it cleartext-only)
          make test-cpp

      - name: Flight door end to end
        run: make test-flight

  # Representative second platform; PRs stay on the Linux job to keep them fast
  build-test-osx:
    name: Build + test (osx_arm64)
    runs-on: macos-14
    if: ${{ github.event_name != 'pull_request' }}
    env:
      GEN: ninja
      # A second platform for the ACL itself, not for the door - this job has no vcpkg step and does
      # not want an hour of Arrow. The door's own job covers the default configuration.
      ACL_NO_FLIGHT: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install ninja ccache

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-osx_arm64-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-osx_arm64-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-
            ccache-osx_arm64-

      - name: Build
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      - name: Unit suites
        run: |
          build/release/test/unittest test/sql/acl.test
          make test-cpp

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: acl-osx_arm64
          path: build/release/extension/acl/acl.duckdb_extension
