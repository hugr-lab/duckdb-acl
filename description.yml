extension:
  name: acl
  description: "Role/token-scoped access control for DuckDB: a parser_override rewrites the query AST (RLS, column masking, computed columns, virtual tables/views/functions) before bind, so a trusted gateway can enforce per-principal policy without touching physical objects directly."
  version: "0.0.1"
  language: "C++"
  build: "cmake"
  license: "MIT"
  maintainers:
    - "VGSML"

repo:
  github: "hugr-lab/duckdb-acl"
  ref: "v0.0.1"

docs:
  hello_world: |
    LOAD acl;
    -- admin registers policy (physical target, projection, RLS template, capabilities)
    SELECT acl_grant_table('analyst', 'orders', 'phys.main.orders_physical',
                           'id,amount', 'tenant = acl_claim(''tenant'')', 'select');
    SELECT acl_define_token('tok', 'analyst', 'tenant=acme');
    -- enable the override, then let the gateway prefix every query
    SET allow_parser_override_extension = 'fallback';
    ACL TOKEN 'tok' SELECT id, amount FROM orders;   -- rewritten to a safe subquery, RLS baked in
  extended_description: |
    The acl extension installs a DuckDB parser_override. A trusted gateway prepends
    `ACL ROLE "<role>"` / `ACL TOKEN '<token>'` / `ACL ADMIN` to every query. The override verifies
    the principal offline, re-parses the remainder with the native parser, and rewrites the parsed AST
    in place before it reaches the binder: virtual names resolve to physical objects (rename in place, or
    a read-only subquery with column projection/masks/computed columns and a row-level-security predicate
    whose claim values are baked in as constants), virtual table/scalar functions expand from templates,
    data-reading / rights-bypass functions (read_csv, postgres_query, ...) are denied, and unknown names
    are refused. The rewritten statements flow through the normal bind -> optimize -> execute path, so
    SELECT and DML both work. See design/DESIGN.md.
